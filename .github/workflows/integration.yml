name: Docker Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Generate test environment
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" > .env
          echo "JWT_SECRET=$(openssl rand -hex 64)" >> .env
          echo "HOST_PORT=3000" >> .env

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health; then
              echo "MikosChat API is healthy"
              exit 0
            fi
            sleep 3
          done
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run message search integration tests
        env:
          TEST_API_URL: http://127.0.0.1:3000/api/v1
          ALLOW_INTEGRATION_TESTS: '1'
        run: npm run test:search

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose down -v
