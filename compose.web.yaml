services:
  server:
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}

  web:
    build:
      context: ../MikosChat-Web
    restart: unless-stopped
    environment:
      BACKEND_URL: http://server:3000
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      - server
